# 只發佈前端兩頁（slides/deck.html 作為首頁、slides/wiki.html），不發佈 raw/ 與執行紀錄。
# 需先在 GitHub repo → Settings → Pages → Source 選「GitHub Actions」。
name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir -p _site
          cp slides/deck.html _site/index.html
          cp slides/deck.html _site/deck.html
          cp slides/wiki.html _site/wiki.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
