()=>`<div class="hero"><section><div class="kicker">AN EXPERIMENT IN IDENTITY · 00</div><h1>第四面鏡<br><span class="accent">我是誰？</span></h1><p class="lead">你認為的自己，和別人看見的你不一樣。而你以為別人看見的你，也可能只是想像。</p><p class="lead">如果這三種描述彼此矛盾——<strong style="color:#f8e2b3">究竟哪一個是你？</strong></p><div class="actions"><button class="cta" data-go="1">進入認知實驗 <span>↗</span></button><button class="pale" data-open-sources>研究來源</button></div><p class="small" style="margin-top:19px">約 8–12 分鐘 · 可重玩 · 無標準人格判定｜「四面鏡（Self 1–4）」為本作自創教學框架，非 Cooley、現代心理學或佛教原典既有四分法（C06, C10）。</p>${wikiSourceTags(['S01','S04','S05'])}</section><div class="orb" aria-hidden="true"><i class="inner"></i><span class="symbol">Ⅳ</span></div></div>`,
()=>`<div class="kicker">ACT 01 · THE SILENCE</div><h2>有人已讀了。<br><span class="muted">卻沒有人回答。</span></h2><div class="two"><div class="phone"><div class="phone-head">小組報告　·　4 位成員</div><div class="chat"><div class="bubble">我把明天報告的簡報整理好了！大家有空可以看一下，有問題我再改。<div class="read">23:48　已讀 3</div></div><div class="silence">十分鐘後 · 仍然沒有回覆</div></div></div><div class="screen-card"><h3>你心裡第一個浮現什麼念頭？</h3><p class="small">先選擇最接近你的想法，後面會再次出現。</p><div class="choose" style="grid-template-columns:1fr">${choice('reaction','worry','他們是不是不喜歡我的報告？')}${choice('reaction','anger','我做完了，為什麼沒有人回應？')}${choice('reaction','busy','他們大概在忙吧。')}${choice('reaction','undecided','我不知道，他們還沒說。')}</div></div></div><p class="small">情境為虛構教學模擬（C11），並非臨床量表或人格測試。</p>`,
()=>`<div class="kicker">ACT 02 · THE FIRST TESTIMONY</div><h2>第一份證詞：<span class="accent">你怎麼理解自己？</span></h2><div class="two"><div class="screen-card"><div class="pill">當事人的內心敘述（虛構情境證詞）</div><p class="bigquestion" style="font-size:clamp(24px,3.6vw,43px)">「我只是想讓明天的報告順利完成。」</p><p class="lead">你花了三個小時整理資料，是因為你認為自己很負責任，也不想拖累團隊。</p></div><div class="screen-card"><div class="tag">SELF 1 · 自我認知（本作教學標籤）</div><h3>一個你相信的「我」</h3><p class="lead">這是你對自身特質、動機和角色的描述（S02 稱為對自身特質與能力的信念；Self 1 為本作教學標籤，C01）。它可能真誠，也可能只掌握事情的一部分。</p><div class="contrast">一個人對自己的理解很重要，但不等於其他人一定有相同感受（C01, C11）。</div>${wikiSourceTags(['S02'])}</div></div>`,
()=>`<div class="kicker">ACT 03 · THE OTHER SIDE</div><h2>第二份證詞：<span class="accent">別人眼中的你</span></h2><div class="two"><div class="voice"><div class="tag">組員 A 的實際陳述（虛構）</div><p>「我覺得他很可靠。時間快到了，他還願意幫大家整理。」</p><div class="small">A 的觀點：可靠、願意承擔</div></div><div class="voice"><div class="tag">組員 B 的實際陳述（虛構）</div><p>「我其實想參與，但他都先做完了，讓我有點不知道能幫什麼。」</p><div class="small">B 的觀點：協作空間不足</div></div></div><div class="contrast"><strong>SELF 2 · 他人的實際評價（Social Perceptions）</strong><br>這裡兩人真的說出了自己的觀點。Self 2 必須有他人的直接陳述或研究量測，不是主角猜到的內容，也不代表世界上存在唯一的「他人看法」（C02, C11）。</div>${wikiSourceTags(['S02','S03'])}`, 
()=>`<div class="kicker">ACT 04 · THE FALSE REFLECTION</div><h2>第三份證詞：<span class="accent">你以為他們怎麼看你</span></h2><div class="screen-card"><div class="tag">SELF 3 · 後設知覺 / METAPERCEPTION（虛構情境對照）</div><div class="statement">你在第 1 幕的念頭：${reactionNames[reaction]}</div><p class="lead">${self3Framing[reaction]}</p><div class="two"><div class="compare-card"><strong>Cooley 鏡中自我三要素（S01, C04）</strong><p>Cooley（1902）指出鏡中自我包含：(1) 想像自己在他人眼中的呈現、(2) 想像他人的評判（imagined judgment）、(3) 由此產生的自豪或羞愧感（但 Cooley 並未提出本作的 Self 1–4 分法）。</p></div><div class="compare-card"><strong>後設準確度的方法與情境限制（S02, S03, C05）</strong><p>研究區分相關性與平均偏誤兩種標準（S02），以及特定雙人關係（DMA）與一般群體聲譽（GMA）兩類研究取向（分別占 93 篇研究的 60.2% 與 18.3%，是研究分布、不是準確率）；既有研究多為橫斷面（94.6%）與大學生樣本（64.5%）（S03），不能斷言猜測總是錯誤或總是準確。</p></div></div><div class="contrast"><strong>核心觀點邊界（C03）：</strong>「我猜他討厭我（Self 3）」≠「他實際討厭我（Self 2）」。把推測改寫成他人實際評價，是資訊層次錯置。</div>${wikiSourceTags(['S01','S02','S03'])}</div>`,
()=>`<div class="kicker">ACT 05 · THE DECISION</div><h2>你現在做的事，<br><span class="accent">會讓故事走向不同方向。</span></h2><p class="lead">如果你相信某種對他人的猜測，你可能因此做出不同選擇。選一個反應，看見一種「可能」的結果。</p><div class="choose">${choice('action','apology','A · 立刻道歉','「是不是我做得不好？」')}${choice('action','accuse','B · 質問他們','「你們是不是故意不回覆？」')}${choice('action','ask','C · 直接詢問意見','「你們最希望我修改哪裡？」')}</div><div class="contrast">這是教學用的虛構分支（C11），不代表任何一種回應都必然造成特定結果。</div><div class="actions"><button class="cta" data-go="6">看這個選擇的結果 →</button></div>`,
()=>`<div class="kicker">ACT 06 · CONSEQUENCE</div><h2>${outcomes[action].title}</h2><div class="screen-card"><div class="tag">故事的一種可能發展 · 虛構案例（C11）</div><div class="quote">${outcomes[action].message}</div><p class="lead">${outcomes[action].comment}</p><div class="divider"></div><p class="small">Self 3（你想像的他人評價）可能影響行動，進而改變 Self 2（他人對你的印象）。但這是虛構教學演示，不是可保證的實證因果規則（C03, C11）。</p><div class="actions"><button class="pale" data-go="5">↶ 重新選擇</button><button class="cta" data-go="7">比較不同走向 →</button></div></div>${wikiSourceTags(['S01','S02','S03'])}`, 
()=>`<div class="kicker">ACT 07 · ALTERNATE REALITIES</div><h2>同一個事件，<span class="accent">不只一種後續。</span></h2><div class="three">${Object.keys(outcomes).map((key,i)=>`<div class="thought"><div class="tag">ROUTE ${['A','B','C'][i]}${action===key?' · 目前選擇':''}</div><h3>${outcomes[key].title.split('｜')[1]}</h3><p class="small">${outcomes[key].comment}</p><button class="outline-btn" data-explore="${key}" aria-label="改走路線 ${['A','B','C'][i]}：${outcomes[key].title.split('｜')[1]}">改走這條路</button></div>`).join('')}</div><div class="contrast">不只是別人塑造我們；我們對別人看法的想像（Self 3），也可能反過來影響互動走向。<br><strong>但敘事可能性不等於學術上的因果證明（C03, C11）。</strong></div>${wikiSourceTags(['S01','S02','S03'])}`, 
()=>`<div class="kicker">ACT 08 · NAME THE MIRRORS</div><h2>現在，我們才替三面鏡子命名。</h2><p class="small">注意：Self 1～3 是本作整合 Cooley 鏡中自我（S01）與後設知覺研究（S02, S03）所設計的教學標籤，並非原典或佛教既有編號（C10）。</p><div class="three"><div class="thought"><div class="tag">SELF 1</div><h3>我眼中的自己</h3><p>「我是認真負責的人。」</p><div class="small">認知者：自己（C01）</div></div><div class="thought"><div class="tag">SELF 2</div><h3>他人眼中的我</h3><p>「他很可靠」／「我想多參與」。</p><div class="small">認知者：組員 A、B 的實際陳述（C02）</div></div><div class="thought"><div class="tag">SELF 3</div><h3>我想像他人眼中的我</h3><p>「他們是不是不喜歡我？」</p><div class="small">認知者：自己對他人評價的推測（C03）</div></div></div><div class="screen-card" style="margin-top:18px"><h3>小測驗：以下哪一種屬於 Self 3？</h3><div class="choose">${choice('quiz','a','甲說：「我本來就很沉默。」')}${choice('quiz','b','乙告訴我：「我覺得你很好相處。」')}${choice('quiz','c','我想：「乙大概覺得我很無聊。」')}</div>${quizChoice?`<div class="quizfeedback">${quizChoice==='c'?'正確。這是「我對他人看法的推測」，不是乙本人說的內容。':'再想想：Self 3 的重點是「我推測別人怎麼評價我」，不只是描述自己或引述對方。'}</div>`:''}</div>${wikiSourceTags(['S01','S02','S03','S04','S05'])}`, 
()=>`<div class="kicker">ACT 09 · THE FOURTH MIRROR</div><div class="two" style="align-items:center"><div class="silhouette" aria-hidden="true">?</div><div><h2>如果三面鏡子<br>說的都不一樣，<br><span class="accent">那麼我是誰？</span></h2><p class="lead">現在的問題已不只是誰對誰錯，而是：有沒有一個恆常的「真正的我」，能由其中一種描述完整代表？</p><p class="small">哲學上，「我是哪種人／我的社會形象與特質」（Characterization Question，會隨情境改變）與「什麼條件讓今天和明天的我是同一個人」（Persistence Question / Personal ontology）是不同層次的問題（S04, C07）。</p></div></div><div class="choose" style="margin-top:22px">${choice('thought','essential','A · 我有穩定的核心','不同視角可能只看見部分。')}${choice('thought','process','B · 我是不斷變動的過程','不同關係與經驗會改變我的認知。')}${choice('thought','question','C · 為什麼必須有一個固定的我？','先質疑這個問題本身的假設。')}</div><p class="small">沒有標準答案；Self 4 是本作引出的開放式哲學提問，不是第四種實證心理類型，四面鏡亦非西方哲學或佛教原典既有分類（C06, C10）。</p>${wikiSourceTags(['S01','S04','S05'])}`,
()=>`<div class="kicker">ACT 10 · ANATTĀ / NOT-SELF</div><h2>佛教提出另一種追問：<br><span class="accent">哪一部分能永遠由我主宰？</span></h2><p class="lead">《無我相經》（SN 22.59，Ñāṇamoli 英譯）討論五蘊——身心經驗的五種分類。點選其中一個，看看它如何參與我們對「我」的認識。</p><div class="five">${[['色','身體／物質形態 (form)'],['受','苦樂等感受 (feeling)'],['想','辨認與知覺 (perception)'],['行','意志與心理形成 (determinations)'],['識','識知經驗 (consciousness)']].map(x=>`<button class="aggregate ${aggregate===x[0]?'selected':''}" data-aggregate="${x[0]}" aria-pressed="${aggregate===x[0]?'true':'false'}"><b>${x[0]}</b><span>${x[1]}</span></button>`).join('')}</div><div class="screen-card" style="margin-top:17px"><div class="tag">目前選擇 · ${aggregate}</div><p class="reveal">${({色:'身體會成長、衰老和改變。經文指出，不能隨意讓形體完全照自己的意願（「令我色如是、勿如是」）存在。',受:'愉快、不愉快與中性的感受會隨條件改變；感受並非永恆不變的自我。',想:'辨認、記憶與對事物的標記會變化，不等同一個永遠固定的觀察者。',行:'意圖、習慣與心理形成（determinations / volitions）彼此依存，也不能完全依自己的意願永遠固定。',識:'識知依條件而有差異，經文同樣不將它視為可永久掌控的實體自我。'})[aggregate]}</p><div class="contrast"><strong>關鍵界線（C08, C09, C10）：</strong>印度佛教心智哲學以五蘊因果相續的動態過程取代獨立不變的實體自我（S06）。<strong>無我 ≠ 人不存在</strong>，亦非否定日常經驗、人格連續性與倫理業力責任；佛教不同部派（如犢子部與世親）及當代學者對無我詮釋亦有差異。<strong>五蘊 ≠ Self 1～4 的一對一分類表</strong>，四面鏡並非佛教原典教義。</div>${wikiSourceTags(['S01','S04','S05','S06'])}</div>`,
()=>`<div class="kicker">ACT 11 · THE OPEN ENDING</div><h2>最後一次，<br><span class="accent">回到那則已讀不回的訊息。</span></h2><div class="two"><div class="screen-card"><div class="tag">你一開始的判斷（虛構情境回顧）</div><div class="quote">${reactionNames[reaction]}</div><div class="small">你選擇的行動：${({apology:'先道歉',accuse:'直接質問',ask:'詢問意見'})[action]}<br>你偏好的哲學思路：${thoughtNames[thought]}</div></div><div class="screen-card"><h3>你現在會怎麼看待最初的自己？</h3><p class="lead">那個「我」也許沒有因為故事結束就消失。改變的可能是：你開始看見不同的觀察者、不同的認知層次，以及不必急著給出唯一結論的可能性。</p><p class="quote" style="font-size:24px">「為什麼我一定要從這些鏡子裡，找到一個固定的自己？」</p></div></div><div class="actions"><button class="cta" data-restart>↶ 重玩整個實驗</button><a class="pale" href="wiki.html" target="_blank" rel="noopener" style="text-decoration:none">打開完整 Wiki ↗</a><button class="pale" data-open-sources>查看哲學來源</button></div><p class="note">本簡報為初學者設計的開放式思考練習（虛構故事 C11），不用來判斷人格、診斷或代替專業諮詢。「四面鏡（Self 1–4）」為本作自創教學框架（C06, C10），所有文獻證據與限制均可於 Wiki 查核。</p>${wikiSourceTags(['S01','S04','S05'])}`
];
const labels=['PROLOGUE','ACT 01 · INCIDENT','ACT 02 · SELF 1','ACT 03 · SELF 2','ACT 04 · SELF 3','ACT 05 · DECISION','ACT 06 · CONSEQUENCE','ACT 07 · REPLAY','ACT 08 · CLASSIFICATION','ACT 09 · SELF 4','ACT 10 · ANATTĀ','ACT 11 · EPILOGUE'];
function render(focusSelector){document.getElementById('stage').innerHTML=scenes[page]();document.getElementById('counter').textContent=String(page+1).padStart(2,'0')+' / 12';document.getElementById('sceneLabel').textContent=labels[page];document.getElementById('progress').style.width=((page+1)/12*100)+'%';document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===11;if(focusSelector){const el=document.querySelector(focusSelector);if(el){el.focus({preventScroll:true});return;}}document.getElementById('stage').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function go(n){page=Math.max(0,Math.min(11,n));render()}
function showSources(id,triggerEl){lastDrawerTrigger=triggerEl||document.activeElement;const ids=id?[id]:sceneRefs[page];const bodyHtml=ids.length?ids.map(s=>`<article class="source-item"><span class="refid">${s}</span><h3>${bibliography[s].title}</h3><p>${bibliography[s].desc}</p>${bibliography[s].license?`<p class="license">${bibliography[s].license}</p>`:''}<a href="${bibliography[s].url}" target="_blank" rel="noopener noreferrer">閱讀原始來源 ↗</a></article>`).join('')+'<div class="note">這些研究支援概念介紹，但不表示故事中的人物與因果分支曾真實發生。詳見 Wiki 中的逐筆 Claim 與來源檔。</div>':'<article class="source-item"><span class="refid">C11 · 虛構教學情境</span><h3>本幕為原創情境模擬（無直接引用之實證文獻）</h3><p>小組聊天室、已讀不回與行動選擇皆為教學用虛構腳本（Claim C11），並非實證心理學實驗數據。理論定義與文獻請於後續幕次或 Wiki 查閱。</p></article>';document.getElementById('sourceList').innerHTML=bodyHtml;const d=document.getElementById('drawer');d.classList.add('open');d.setAttribute('aria-hidden','false');document.getElementById('closeDrawer').focus()}
function closeSources(){const d=document.getElementById('drawer');d.classList.remove('open');d.setAttribute('aria-hidden','true');if(lastDrawerTrigger&&document.body.contains(lastDrawerTrigger))lastDrawerTrigger.focus();else document.getElementById('sourcesButton').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-go'))go(Number(b.dataset.go));else if(b.hasAttribute('data-reaction')){reaction=b.dataset.reaction;render(`[data-reaction="${reaction}"]`)}else if(b.hasAttribute('data-action')){action=b.dataset.action;render(`[data-action="${action}"]`)}else if(b.hasAttribute('data-thought')){thought=b.dataset.thought;render(`[data-thought="${thought}"]`)}else if(b.hasAttribute('data-quiz')){quizChoice=b.dataset.quiz;render(`[data-quiz="${quizChoice}"]`)}else if(b.hasAttribute('data-aggregate')){aggregate=b.dataset.aggregate;render(`[data-aggregate="${aggregate}"]`)}else if(b.hasAttribute('data-explore')){action=b.dataset.explore;go(6)}else if(b.hasAttribute('data-restart')){reaction='undecided';action='ask';thought='process';aggregate='色';quizChoice='';go(0)}else if(b.hasAttribute('data-source'))showSources(b.dataset.source,b);else if(b.hasAttribute('data-open-sources'))showSources(null,b)});
document.getElementById('prev').addEventListener('click',()=>go(page-1));document.getElementById('next').addEventListener('click',()=>go(page+1));document.getElementById('sourcesButton').addEventListener('click',e=>showSources(null,e.currentTarget));document.getElementById('closeDrawer').addEventListener('click',closeSources);document.getElementById('drawer').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSources()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('drawer').classList.contains('open'))closeSources();else if(!document.getElementById('drawer').classList.contains('open')&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){if(e.key==='ArrowRight'){e.preventDefault();go(page+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(page-1)}}});
render();
</script>
</body></html>
